<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Proveedores</title>
    <link rel="stylesheet" href="proveedores.css">
</head>
<body>

<h1>Gestión de Proveedores</h1>

<button class="btn crear" onclick="abrirModal()">➕ Agregar Proveedor</button>
<form action="importarProveedor.php" method="POST" enctype="multipart/form-data">
    
    <label for="csv">Subir archivo CSV:</label>
    <input type="file" name="archivo" accept=".csv" required>
    <button type="submit">Importar Usuarios</button>
      </form>

<div class="tabla-container">
    <table>
        <thead>
            <tr>
                <th>ID Proveedor</th>
                <th>Nombre</th>
                <th>Empresa</th>
                <th>Teléfono</th>
                <th>Servicio</th>
                <th>Vehículo (Placa)</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-proveedores">
            <tr><td colspan="7">Cargando...</td></tr>
        </tbody>
    </table>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">

        <div class="modal-scroll">
            <h2 id="modal-titulo">Nuevo Proveedor</h2>

            <form id="form-proveedor">
                <input type="hidden" id="modo" name="modo">

                <label>ID Proveedor</label>
                <input type="text" id="id_proveedor" name="id_proveedor" required>

                <label>Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label>Apellido</label>
                <input type="text" id="apellido" name="apellido" required>

                <label>Razón Social</label>
                <input type="text" id="razon_social" name="razon_social" required>

                <label>RFC</label>
                <input type="text" id="rfc" name="rfc" required>

                <label>Telefono</label>
                <input type="text" id="telefono" name="telefono" required>

                <label>Correo</label>
                <input type="email" id="correo" name="correo">

                <label>Tipo Servicio</label>
                <input type="text" id="tipo_servicio" name="tipo_servicio">

                <label>Empresa</label>
                <input type="text" id="empresa" name="empresa">

                <hr>
                <h3>Datos del Vehículo</h3>

                <label>RFID</label>
                <input type="text" id="rfid" name="rfid">

                <label>Tipo Vehículo</label>
                <input type="text" id="tipo_vehiculo" name="tipo_vehiculo">

                <label>Marca</label>
                <input type="text" id="marca" name="marca">

                <label>Modelo</label>
                <input type="text" id="modelo" name="modelo">

                <label>Año</label>
                <input type="text" id="año" name="año">

                <label>Color</label>
                <input type="text" id="color" name="color">

                <label>Placa</label>
                <input type="text" id="placa" name="placa">
            </form>
        </div>

        <div class="modal-buttons">
            <button type="button" class="btn cancelar" onclick="cerrarModal()">Cancelar</button>
            <button type="submit" form="form-proveedor" class="btn guardar">Guardar</button>
        </div>
    </div>
</div>


<script src="proveedores.js"></script>
</body>
</html>
