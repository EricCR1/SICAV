<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICAV - Pruebas RFID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="registro-rfid.css">
</head>
<body>
    <div class="header">
        <h1>🚗 SICAV - Pruebas RFID</h1>
        <p>Sistema de Control de Acceso Vehicular - Modo Pruebas</p>
    </div>

    <div class="container">
        <!-- Panel de Entrada -->
        <div class="registro-panel entrada">
            <div class="panel-header">
                <i class="fas fa-sign-in-alt"></i>
                <h3>Registro de Entrada</h3>
            </div>
            <div class="panel-body">
                <div class="rfid-input-container">
                    <label for="rfid-entrada">Número de RFID:</label>
                    <div class="input-group">
                        <input type="text" id="rfid-entrada" placeholder="Ingresa el RFID para entrada" maxlength="20" autocomplete="off">
                        <button class="btn btn-success" onclick="registrarEntrada()">
                            <i class="fas fa-check"></i> Registrar Entrada
                        </button>
                    </div>
                </div>
                <div class="estado-registro info" id="estado-entrada">
                    <div class="estado-icon">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <div class="estado-mensaje">
                        Listo para registrar entrada
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel de Salida -->
        <div class="registro-panel salida">
            <div class="panel-header">
                <i class="fas fa-sign-out-alt"></i>
                <h3>Registro de Salida</h3>
            </div>
            <div class="panel-body">
                <div class="rfid-input-container">
                    <label for="rfid-salida">Número de RFID:</label>
                    <div class="input-group">
                        <input type="text" id="rfid-salida" placeholder="Ingresa el RFID para salida" maxlength="20" autocomplete="off">
                        <button class="btn btn-danger" onclick="registrarSalida()">
                            <i class="fas fa-check"></i> Registrar Salida
                        </button>
                    </div>
                </div>
                <div class="estado-registro info" id="estado-salida">
                    <div class="estado-icon">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <div class="estado-mensaje">
                        Listo para registrar salida
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="registro-rfid.js"></script>
</body>
</html>
