<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICAV - Registro de Visitantes</title>
    <link rel="stylesheet" href="guardia.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Registro de Visitantes</h1>
            <p>Complete los datos del visitante</p>
            <div class="status-bar">
                <span id="fecha-hora"></span>
                <span class="status-online">● En línea</span>
            </div>
        </div>

        <div class="form-container">
            <div id="alert" class="alert"></div>

            <form action = "guardar.php" method="post"id="visitanteForm">
                <!-- Datos personales -->
                <div class="form-group">
                    <label class="required">Datos Personales</label>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" name="nombre" placeholder="Nombre(s)" required>
                        </div>
                        <div class="input-group">
                            <input type="text" name="apellido" placeholder="Apellidos" required>
                        </div>
                    </div>
                </div>

                <!-- Información de visita -->
                <div class="form-group">
                    <label class="required">Información de la Visita</label>
                    <div class="input-group">
                        <input type="text" name="motivo" placeholder="Motivo de la visita" required>
                    </div>
                </div>

                <!-- Datos del vehículo -->
                <div class="form-group">
                    <label class="required">Datos del Vehículo</label>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" name="placa" placeholder="Placas del vehículo" required maxlength="10" class="uppercase">
                        </div>
                        <div class="input-group">
                            <input type="text" name="marca" placeholder="Marca del vehículo">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" name="color" placeholder="Color del vehículo">
                        </div>
                        <div class="input-group">
                            <select name="tipo_vehiculo">
                                <option value="automovil">Automóvil</option>
                                <option value="motocicleta">Motocicleta</option>
                                <option value="camioneta">Camioneta</option>
                                
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <button type="submit" class="btn btn-primary">
                    📝 Registrar Visitante
                </button>

                <div class="quick-actions">
                    <button type="reset" class="btn btn-secondary">
                        🗑️ Limpiar Formulario
                    </button>
                </div>
            </form>

            <!-- Lista de visitantes recientes -->
            <div class="recent-visitors">
                <h3>📋 Visitantes Registrados Hoy</h3>
                <div id="lista-visitantes" class="visitors-list">
                    <div class="empty-list">Los visitantes aparecerán aquí</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
